; In-circuit capacitor checker - ESP32-C3 0.42" OLED board (SDA=GPIO5, SCL=GPIO6, BOOT button=GPIO9)
[env:esp32c3]
platform = espressif32@^6.9.0   ; ESP-IDF 5.3+ (the code uses driver/i2c_master.h and adc_continuous)
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
board_upload.flash_size = 2MB
board_build.flash_size = 2MB
; OLED window offset inside the SSD1306's 128x64 RAM. If the picture is cut off or shifted, adjust these two.
; Wi-Fi access point: -DAP_SSID=\"CapChecker\" -DAP_PASS=\"capcheck1\" (>= 8 chars); -DWIFI_ENABLED=0 builds without Wi-Fi/web.
build_flags =
    -Wno-error=format-truncation
    -DOLED_XOFF=30
    -DOLED_YOFF=24
